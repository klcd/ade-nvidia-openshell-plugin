id: codex
resource_version: 1
display_name: Codex
description: OpenAI Codex CLI
category: agent
credentials:
  - name: access_token
    description: Codex OAuth access token
    env_vars:
      - CODEX_AUTH_ACCESS_TOKEN
    required: false
    stable_placeholder: true
    auth_style: ""
    header_name: ""
    query_param: ""
  - name: refresh_token
    description: Codex OAuth refresh token
    env_vars:
      - CODEX_AUTH_REFRESH_TOKEN
    required: false
    stable_placeholder: true
    auth_style: ""
    header_name: ""
    query_param: ""
  - name: account_id
    description: Codex account identifier
    env_vars:
      - CODEX_AUTH_ACCOUNT_ID
    required: false
    stable_placeholder: true
    auth_style: ""
    header_name: ""
    query_param: ""
  - name: id_token
    description: Codex OAuth ID token
    env_vars:
      - CODEX_AUTH_ID_TOKEN
    required: false
    stable_placeholder: true
    auth_style: ""
    header_name: ""
    query_param: ""
  - name: api_key
    description: OpenAI API key, when Codex is configured for API key authentication
    env_vars:
      - OPENAI_API_KEY
    required: false
    stable_placeholder: true
    auth_style: bearer
    header_name: Authorization
    query_param: ""
endpoints:
  - host: api.openai.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
    request_body_credential_rewrite: true
  - host: auth.openai.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
    request_body_credential_rewrite: true
  - host: chatgpt.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
    request_body_credential_rewrite: true
  - host: ab.chatgpt.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
    request_body_credential_rewrite: true
binaries:
  - /usr/bin/codex
  - /usr/local/bin/codex
  - /usr/bin/node
  - /usr/local/bin/node
  - /usr/lib/node_modules/@openai/**
  - /usr/local/lib/node_modules/@openai/**
inference_capable: true
discovery:
  credentials:
    - access_token
    - refresh_token
    - account_id
    - id_token
    - api_key
source: user
scope: platform
