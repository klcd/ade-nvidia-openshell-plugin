<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenShell Policies &amp; CLI Commands</title>
<style>
  :root {
    --bg: var(--orca-background, #0d1117);
    --fg: var(--orca-foreground, #e6edf3);
    --muted: var(--orca-muted, #161b22);
    --muted-fg: var(--orca-muted-foreground, #8b949e);
    --border: var(--orca-border, #30363d);
    --input: var(--orca-input, #21262d);
    --primary: var(--orca-primary, #2f81f7);
    --primary-fg: var(--orca-primary-foreground, #ffffff);
    --success: #2ea043;
    --success-bg: rgba(46, 160, 67, 0.14);
    --warn: #d29922;
    --warn-bg: rgba(210, 153, 34, 0.15);
    --danger: var(--orca-destructive, #f85149);
    --danger-bg: rgba(248, 81, 73, 0.14);
    --radius: var(--orca-radius, 8px);
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font: 12.5px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .container {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 10px;
    max-width: 100%;
  }
  .header {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px;
    background: var(--muted);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }
  .title {
    font-weight: 600;
    font-size: 13.5px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .controls {
    display: flex;
    gap: 6px;
    width: 100%;
  }
  select, input[type="text"] {
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    font: inherit;
    outline: none;
  }
  select { flex: 1; min-width: 0; }
  input[type="text"] { width: 100%; }
  select:focus, input[type="text"]:focus {
    border-color: var(--primary);
  }
  button {
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 9px;
    font: inherit;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover {
    background: var(--input);
  }
  button.primary {
    background: var(--primary);
    color: var(--primary-fg);
    border-color: var(--primary);
    font-weight: 500;
  }
  .tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
    overflow-x: auto;
  }
  .tab {
    padding: 5px 9px;
    border-radius: 6px;
    font-size: 12px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted-fg);
  }
  .tab.active {
    background: var(--muted);
    color: var(--fg);
    border-color: var(--border);
    font-weight: 600;
  }
  .card {
    background: var(--muted);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .card-title {
    font-weight: 600;
    font-size: 12.5px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .sub {
    color: var(--muted-fg);
    font-size: 11.5px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 6px;
    border-radius: 999px;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.01em;
    border: 1px solid transparent;
  }
  .badge.allow, .badge.pass {
    color: var(--success);
    background: var(--success-bg);
    border-color: rgba(46, 160, 67, 0.35);
  }
  .badge.ask, .badge.warn {
    color: var(--warn);
    background: var(--warn-bg);
    border-color: rgba(210, 153, 34, 0.35);
  }
  .badge.deny, .badge.block {
    color: var(--danger);
    background: var(--danger-bg);
    border-color: rgba(248, 81, 73, 0.35);
  }
  .badge.neutral {
    color: var(--muted-fg);
    background: var(--bg);
    border-color: var(--border);
  }
  .mono {
    font-family: var(--mono);
    font-size: 11.5px;
  }
  .cmd-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .cmd-left {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
    flex: 1;
  }
  .cmd-code {
    font-family: var(--mono);
    font-size: 11.5px;
    word-break: break-all;
    color: var(--fg);
  }
  .cmd-meta {
    font-size: 11px;
    color: var(--muted-fg);
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .chip {
    font-family: var(--mono);
    font-size: 11px;
    padding: 2px 6px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
  }
  .tester-box {
    display: flex;
    gap: 6px;
  }
  .eval-result {
    padding: 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .grid-2 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 6px;
  }
  .stat-box {
    padding: 7px 9px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .copy-btn {
    padding: 2px 6px;
    font-size: 10.5px;
  }
  details.app-fold {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  details.app-fold > summary {
    list-style: none;
    cursor: pointer;
    padding: 8px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    user-select: none;
    font-weight: 600;
    font-size: 12px;
  }
  details.app-fold > summary::-webkit-details-marker {
    display: none;
  }
  details.app-fold > summary:hover {
    background: rgba(255, 255, 255, 0.03);
  }
  .fold-chevron {
    display: inline-block;
    font-size: 10px;
    color: var(--muted-fg);
    transition: transform 0.15s ease;
    width: 12px;
  }
  details.app-fold[open] > summary .fold-chevron {
    transform: rotate(90deg);
  }
  .app-fold-body {
    padding: 8px 10px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: var(--bg);
  }
  details.egress-fold {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  details.egress-fold > summary {
    list-style: none;
    cursor: pointer;
    padding: 7px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    user-select: none;
  }
  details.egress-fold > summary::-webkit-details-marker {
    display: none;
  }
  details.egress-fold > summary:hover {
    background: rgba(255, 255, 255, 0.03);
  }
  details.egress-fold[open] > summary .fold-chevron {
    transform: rotate(90deg);
  }
  .egress-fold-body {
    padding: 8px 10px;
    border-top: 1px solid var(--border);
    background: rgba(0, 0, 0, 0.16);
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 11.5px;
  }
  .access-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .access-dot.rw {
    background: var(--success);
    box-shadow: 0 0 0 2px rgba(46, 160, 67, 0.22);
  }
  .access-dot.ro {
    background: #388bfd;
    box-shadow: 0 0 0 2px rgba(56, 139, 253, 0.22);
  }
  .access-dot.l7 {
    background: var(--warn);
    box-shadow: 0 0 0 2px rgba(210, 153, 34, 0.22);
  }
  .access-dot.deny {
    background: var(--danger);
    box-shadow: 0 0 0 2px rgba(248, 81, 73, 0.22);
  }
  .right-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 7px;
    border-radius: 999px;
    font-size: 10.5px;
    font-weight: 600;
    background: var(--muted);
    border: 1px solid var(--border);
    color: var(--fg);
    white-space: nowrap;
  }
  .source-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 7px;
    border-radius: 5px;
    font-family: var(--mono);
    font-size: 10.5px;
    background: var(--muted);
    border: 1px solid var(--border);
    color: var(--muted-fg);
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-top">
        <div class="title">
          <span>OpenShell Policies</span>
          <span id="sandboxBadge" class="badge neutral">Loading...</span>
        </div>
        <button id="refreshBtn" title="Reload active project &amp; agent policies">Refresh</button>
      </div>
      <div id="contextBanner" class="grid-2" style="margin-top:2px;">
        <div class="stat-box" id="projectStatBox" style="flex-direction:row;justify-content:space-between;align-items:center;padding:7px 10px;">
          <div style="display:flex;flex-direction:column;gap:1px;min-width:0;">
            <span class="sub" style="font-size:10px;">Project</span>
            <strong id="projectLabel" class="mono" style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Detecting...</strong>
          </div>
          <span id="branchBadge" class="badge neutral">—</span>
        </div>
        <div class="stat-box" style="flex-direction:row;justify-content:space-between;align-items:center;padding:7px 10px;">
          <div style="display:flex;flex-direction:column;gap:1px;min-width:0;">
            <span class="sub" style="font-size:10px;">Agent</span>
            <strong id="agentLabel" class="mono" style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Detecting...</strong>
          </div>
          <span id="agentStateBadge" class="badge allow">Active</span>
        </div>
      </div>
    </div>

    <!-- Interactive CLI Command Policy Tester -->
    <div class="card" style="padding:8px 10px;gap:6px;">
      <div class="card-title">
        <span>Test CLI Command</span>
      </div>
      <div class="tester-box">
        <input id="cmdInput" type="text" class="mono" placeholder="Enter command to test..." />
        <button id="testBtn" class="primary">Check</button>
      </div>
      <div id="evalOutput" style="display:none;" class="eval-result"></div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="cli">CLI Commands (<span id="cliCount">0</span>)</button>
      <button class="tab" data-tab="egress">Sandbox Egress (<span id="egressCount">0</span>)</button>
      <button class="tab" data-tab="system">Sandbox System</button>
    </div>

    <div id="tabContent"></div>
  </div>

  <script>
    let currentReport = null;
    let activeTab = 'cli';
    let searchFilter = '';
    let actionFilter = 'all';
    const openApps = new Set();
    const openEgress = new Set();
    const openSystemItems = new Set();

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function copyText(text, btn) {
      try {
        await navigator.clipboard.writeText(text);
        if (btn) {
          const prev = btn.textContent;
          btn.textContent = 'Copied';
          setTimeout(() => { btn.textContent = prev; }, 1000);
        }
      } catch {}
    }

    async function loadReport() {
      try {
        const res = await window.orca.plugin.request('getPolicyReport', {});
        const changedContext =
          !currentReport ||
          currentReport.selectedWorkspace.path !== res.selectedWorkspace.path ||
          currentReport.currentAgent !== res.currentAgent ||
          currentReport.activeSandboxes.length !== res.activeSandboxes.length;
        currentReport = res;
        renderHeader();
        if (changedContext || (!document.getElementById('ruleSearch') && !document.getElementById('egressSearch') && activeTab !== 'system')) {
          renderActiveTab();
        }
        const cmd = document.getElementById('cmdInput').value.trim();
        if (cmd && changedContext) await runCommandCheck(cmd);
      } catch (err) {
        document.getElementById('tabContent').innerHTML =
          `<div class="card"><span class="badge deny">Error</span><div class="mono">${escapeHtml(err?.message || err)}</div></div>`;
      }
    }

    function renderHeader() {
      if (!currentReport) return;
      const sbCount = currentReport.activeSandboxes.length;
      const badge = document.getElementById('sandboxBadge');
      badge.className = 'badge ' + (sbCount > 0 ? 'allow' : 'neutral');
      badge.textContent = sbCount > 0
        ? `${sbCount} Sandbox${sbCount === 1 ? '' : 'es'}`
        : 'Enforced';

      const ws = currentReport.selectedWorkspace;
      document.getElementById('projectLabel').textContent = ws.name;
      const projBox = document.getElementById('projectStatBox');
      if (projBox) projBox.title = ws.path;
      const branchBadge = document.getElementById('branchBadge');
      branchBadge.textContent = ws.branch || 'main';

      const agentObj = currentReport.agents[0];
      const activeSession = (currentReport.activeAgentSessions || [])[0];
      const agentDisplay = agentObj ? agentObj.displayName : currentReport.currentAgent;
      document.getElementById('agentLabel').textContent = agentDisplay;

      const stateBadge = document.getElementById('agentStateBadge');
      const sessionState = activeSession ? activeSession.state : (sbCount > 0 ? 'sandboxed' : 'ready');
      stateBadge.textContent = sessionState.toUpperCase();
      stateBadge.className = 'badge ' + (sessionState === 'working' || sessionState === 'running' || sbCount > 0 ? 'allow' : 'neutral');

      const agentRules = currentReport.allCliRules.filter(r => r.compatibleAgents.includes(currentReport.currentAgent));
      document.getElementById('cliCount').textContent = String(agentRules.length);
      const egressCountEl = document.getElementById('egressCount');
      if (egressCountEl) {
        egressCountEl.textContent = String(agentObj?.endpoints?.length || 0);
      }
    }

    let lastL7Suggestion = null;

    async function applyL7PolicyRule(payload, statusElId) {
      const statusEl = document.getElementById(statusElId);
      if (statusEl) {
        statusEl.style.display = 'flex';
        statusEl.innerHTML = `<span class="badge neutral">Applying L7 policy...</span>`;
      }
      try {
        const res = await window.orca.plugin.request('addL7Policy', {
          ...payload,
          workspacePath: currentReport?.selectedWorkspace?.path,
          agent: currentReport?.currentAgent,
        });
        if (statusEl) {
          const cmdsHtml = (res.cliCommandsRun || []).map(c => `<div class="mono sub">$ ${escapeHtml(c)}</div>`).join('');
          statusEl.innerHTML = `
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
              <span class="badge ${res.ok ? 'allow' : 'deny'}">${res.ok ? 'APPLIED' : 'ERROR'}</span>
              <span>${escapeHtml(res.message)}</span>
            </div>
            ${cmdsHtml}
          `;
        }
        if (res.ok) {
          const reportRes = await window.orca.plugin.request('getPolicyReport', {});
          currentReport = reportRes;
          renderHeader();
          renderActiveTab();
          const cmd = document.getElementById('cmdInput').value.trim();
          if (cmd) await runCommandCheck(cmd);
        }
      } catch (err) {
        if (statusEl) {
          statusEl.innerHTML = `<span class="badge deny">Error</span><div>${escapeHtml(err?.message || err)}</div>`;
        }
      }
    }

    async function runCommandCheck(command) {
      if (!command || !currentReport) return;
      const box = document.getElementById('evalOutput');
      try {
        const res = await window.orca.plugin.request('evaluateCommand', {
          command,
          workspacePath: currentReport.selectedWorkspace.path,
          agent: currentReport.currentAgent,
        });
        lastL7Suggestion = res.l7Suggestion || null;
        box.style.display = 'flex';
        const dotClassForAction = (act) => act === 'allow' || act === 'pass' ? 'rw' : act === 'ask' || act === 'warn' ? 'l7' : 'deny';
        const verdictDot = dotClassForAction(res.verdict);
        const rulesHtml = (res.matchedRules || []).map(r => {
          const rDot = dotClassForAction(r.action);
          return `<div class="cmd-meta" style="align-items:center;"><span class="access-dot ${rDot}" title="Rule: ${escapeHtml(r.action)}"></span><span class="mono" style="color:var(--fg);font-weight:600;">${escapeHtml(r.cliCommand)}</span><span class="source-pill" title="Source: ${escapeHtml(r.sourceFile)}">&#8984; ${escapeHtml(r.groupName)}</span></div>`;
        }).join('');
        const checksHtml = (res.sandboxChecks || []).map(c => {
          const cDot = dotClassForAction(c.status);
          return `<div class="cmd-meta" style="align-items:center;"><span class="access-dot ${cDot}" title="${escapeHtml(c.layer)}: ${escapeHtml(c.status)}"></span><strong style="color:var(--fg);">${escapeHtml(c.layer)}:</strong><span>${escapeHtml(c.detail)}</span></div>`;
        }).join('');
        const l7ActionHtml = res.l7Suggestion
          ? `<div style="margin-top:4px;padding-top:6px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px;">
              <div class="cmd-meta" style="align-items:center;">
                <span class="access-dot l7" title="L7 HTTP Rule"></span>
                <strong style="color:var(--fg);">L7 HTTP Rule:</strong>
                <code class="mono">${escapeHtml(res.l7Suggestion.action.toUpperCase())} ${escapeHtml(res.l7Suggestion.method)} https://${escapeHtml(res.l7Suggestion.host)}:${res.l7Suggestion.port}${escapeHtml(res.l7Suggestion.path)}</code>
                <span class="source-pill">&#8984; ${escapeHtml(res.l7Suggestion.binary)}</span>
              </div>
              <div style="display:flex;gap:6px;flex-wrap:wrap;">
                <button class="copy-btn quick-l7-btn" data-l7-scope="session" title="Hot-reload on running sandbox via openshell policy update">+ Session</button>
                <button class="copy-btn quick-l7-btn" data-l7-scope="workspace" title="Save to <project>/.agents/policies/l7-custom.json &amp; apply live">+ Project</button>
                <button class="copy-btn quick-l7-btn" data-l7-scope="global" title="Save to ~/.agents/orca-openshell-policies/<agent>.json &amp; apply live">+ Global (${escapeHtml(currentReport.currentAgent)})</button>
              </div>
              <div id="quickL7Status" style="display:none;" class="eval-result"></div>
            </div>`
          : '';
        box.innerHTML = `
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
            <div style="display:flex;align-items:center;gap:7px;min-width:0;">
              <span class="access-dot ${verdictDot}" title="Verdict: ${escapeHtml(res.verdict)}"></span>
              <span class="mono" style="font-weight:600;color:var(--fg);">${escapeHtml(res.command)}</span>
            </div>
            <span class="source-pill">${escapeHtml(res.verdict.toUpperCase())}</span>
          </div>
          <div class="sub">${escapeHtml(res.summary)}</div>
          ${rulesHtml}
          ${checksHtml}
          ${l7ActionHtml}
        `;
      } catch (err) {
        box.style.display = 'flex';
        box.innerHTML = `<div style="display:flex;align-items:center;gap:6px;"><span class="access-dot deny"></span><div>${escapeHtml(err?.message || err)}</div></div>`;
      }
    }

    const openCliRules = new Set();

    function renderCliTab() {
      const selectedAgent = currentReport.currentAgent;

      const filteredRules = currentReport.allCliRules.filter(r => {
        if (!r.compatibleAgents.includes(selectedAgent)) return false;
        if (actionFilter !== 'all' && r.action !== actionFilter) return false;
        if (!searchFilter) return true;
        const q = searchFilter.toLowerCase();
        return r.cliCommand.toLowerCase().includes(q) ||
               r.baseBinary.toLowerCase().includes(q) ||
               r.raw.toLowerCase().includes(q) ||
               r.groupName.toLowerCase().includes(q);
      });

      const byApp = new Map();
      for (const r of filteredRules) {
        const appKey = r.baseBinary || r.tool || 'other';
        if (!byApp.has(appKey)) byApp.set(appKey, []);
        byApp.get(appKey).push(r);
      }

      const sortedApps = [...byApp.entries()].sort((a, b) => a[0].localeCompare(b[0]));

      const appsHtml = sortedApps.map(([appName, rules]) => {
        const allowCount = rules.filter(r => r.action === 'allow').length;
        const askCount = rules.filter(r => r.action === 'ask').length;
        const denyCount = rules.filter(r => r.action === 'deny').length;
        const sources = [...new Set(rules.map(r => r.groupName))].join(', ');
        const isOpen = Boolean(searchFilter) || openApps.has(appName);
        const appDotClass = denyCount > 0 && allowCount === 0
          ? 'deny'
          : askCount > 0 && allowCount === 0
            ? 'l7'
            : 'rw';

        const rows = rules.map(r => {
          const ruleKey = `${r.scope}:${r.sourceFile}:${r.raw}`;
          const isRuleOpen = openCliRules.has(ruleKey);
          const dotClass = r.action === 'deny' ? 'deny' : r.action === 'ask' ? 'l7' : 'rw';
          const cleanCmd = r.cliCommand.replace(/\s*\[args\.\.\.\]/, '');
          const scopePath = r.scope === 'global'
            ? `~/.agents/permissions/${r.sourceFile}`
            : `.agents/permissions/${r.sourceFile}`;
          const explanation = r.explanation ||
            `${r.action.toUpperCase()} rule for ${r.cliCommand} (${scopePath}).`;

          return `
            <details class="egress-fold" data-cli-rule="${escapeHtml(ruleKey)}" ${isRuleOpen ? 'open' : ''}>
              <summary>
                <div style="display:flex;align-items:center;gap:8px;min-width:0;flex:1;">
                  <span class="fold-chevron">&#9654;</span>
                  <span class="access-dot ${dotClass}" title="Right: ${escapeHtml(r.action)}"></span>
                  <span class="cmd-code" style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(r.cliCommand)}</span>
                </div>
                <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
                  <span class="source-pill">&#8984; ${escapeHtml(r.groupName)}</span>
                </div>
              </summary>
              <div class="egress-fold-body">
                <div style="color:var(--fg);line-height:1.45;">
                  ${escapeHtml(explanation)}
                </div>
                <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:2px;">
                  <span class="sub mono">${escapeHtml(scopePath)} &bull; ${escapeHtml(r.raw)}</span>
                  <div style="display:flex;gap:4px;">
                    <button class="copy-btn sample-cmd" data-cmd="${escapeHtml(cleanCmd)}">Test</button>
                    <button class="copy-btn" data-copy="${escapeHtml(cleanCmd)}">Copy</button>
                  </div>
                </div>
              </div>
            </details>
          `;
        }).join('');

        return `
          <details class="app-fold" data-app="${escapeHtml(appName)}" ${isOpen ? 'open' : ''}>
            <summary>
              <div style="display:flex;align-items:center;gap:8px;min-width:0;flex:1;">
                <span class="fold-chevron">&#9654;</span>
                <span class="access-dot ${appDotClass}"></span>
                <code class="mono" style="font-size:12px;font-weight:700;">${escapeHtml(appName)}</code>
                <span class="sub" style="font-weight:400;">(${rules.length})</span>
              </div>
              <div style="display:flex;gap:4px;align-items:center;flex-shrink:0;">
                <span class="source-pill">&#8984; ${escapeHtml(sources)}</span>
              </div>
            </summary>
            <div class="app-fold-body">
              ${rows}
            </div>
          </details>
        `;
      }).join('');

      return `
        <div class="controls">
          <input id="ruleSearch" type="text" placeholder="Filter CLI command (e.g. git, docker, kubectl, orca)..." value="${escapeHtml(searchFilter)}" />
          <select id="actionSelect" style="max-width:105px;">
            <option value="all" ${actionFilter === 'all' ? 'selected' : ''}>All</option>
            <option value="allow" ${actionFilter === 'allow' ? 'selected' : ''}>Allow</option>
            <option value="ask" ${actionFilter === 'ask' ? 'selected' : ''}>Ask</option>
            <option value="deny" ${actionFilter === 'deny' ? 'selected' : ''}>Deny</option>
          </select>
          <button id="expandAllBtn" class="copy-btn">Expand</button>
          <button id="collapseAllBtn" class="copy-btn">Collapse</button>
        </div>
        ${appsHtml || '<div class="card"><div class="sub">No matching CLI permission rules found.</div></div>'}
      `;
    }

    let egressSearch = '';
    const openSections = new Set();

    function renderEgressTab() {
      const agents = currentReport.agents;
      const a = agents[0];
      if (!a) {
        return `<div class="card"><div class="sub">No agent profile found.</div></div>`;
      }

      const l7ComposerFoldHtml = `
        <details class="app-fold" data-section="l7-composer" ${openSections.has('l7-composer') ? 'open' : ''}>
          <summary>
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="fold-chevron">&#9654;</span>
              <span class="access-dot l7"></span>
              <span>+ Add L7 Egress Rule</span>
            </div>
            <span class="source-pill">&#8984; l7-policy</span>
          </summary>
          <div class="app-fold-body">
            <div class="controls">
              <select id="l7Scope" style="max-width:170px;">
                <option value="workspace">Project (.agents/policies)</option>
                <option value="global">Global (${escapeHtml(currentReport.currentAgent)}.json)</option>
                <option value="session">Session (Live Sandbox)</option>
              </select>
              <select id="l7Action" style="max-width:90px;">
                <option value="allow">ALLOW</option>
                <option value="deny">DENY</option>
              </select>
              <select id="l7Method" style="max-width:90px;">
                <option value="GET">GET</option>
                <option value="POST">POST</option>
                <option value="PUT">PUT</option>
                <option value="PATCH">PATCH</option>
                <option value="DELETE">DELETE</option>
                <option value="*">* (ANY)</option>
              </select>
            </div>
            <div class="controls">
              <input id="l7Host" type="text" class="mono" placeholder="Host (e.g. api.github.com)" style="flex:2;" />
              <input id="l7Port" type="text" class="mono" value="443" placeholder="Port" style="max-width:60px;" />
              <input id="l7Path" type="text" class="mono" value="/repos/**" placeholder="Path (e.g. /repos/**)" style="flex:2;" />
            </div>
            <div class="controls">
              <input id="l7Binary" type="text" class="mono" value="*" placeholder="Binary (e.g. /usr/bin/gh)" style="flex:1;" />
              <input id="l7TriggerCmd" type="text" class="mono" placeholder="Triggering CLI / script" style="flex:2;" />
              <button id="addL7Btn" class="primary">Add</button>
            </div>
            <div id="l7ComposerStatus" style="display:none;" class="eval-result"></div>
          </div>
        </details>
      `;

      const filteredEndpoints = a.endpoints.filter(ep => {
        if (!egressSearch) return true;
        const q = egressSearch.toLowerCase();
        return ep.host.toLowerCase().includes(q) ||
               (ep.triggerSource || '').toLowerCase().includes(q) ||
               (ep.triggerExplanation || '').toLowerCase().includes(q) ||
               (ep.policyName || '').toLowerCase().includes(q) ||
               (ep.compatibleCliCommands || []).some(c => c.toLowerCase().includes(q));
      });

      const endpointsHtml = filteredEndpoints.map(ep => {
        const epKey = `${ep.host}:${ep.port}:${ep.policyName}`;
        const isOpen = Boolean(egressSearch) || openEgress.has(epKey);
        const hasDenyRule = (ep.l7Rules || []).some(r => r.action === 'deny') && !(ep.l7Rules || []).some(r => r.action === 'allow');
        const dotClass = hasDenyRule
          ? 'deny'
          : ep.access === 'read-only'
            ? 'ro'
            : (ep.access === 'l7-rules' || (ep.l7Rules && ep.l7Rules.length > 0))
              ? 'l7'
              : 'rw';
        const triggerLabel = ep.triggerSource || (ep.compatibleCliCommands && ep.compatibleCliCommands[0]) || 'cli';
        const explanationText = ep.triggerExplanation ||
          `Outbound network egress to ${ep.host}:${ep.port} triggered by ${(ep.compatibleCliCommands || []).join(', ')} (defined in ${ep.source}).`;
        const l7Html = (ep.l7Rules || []).length > 0
          ? `<div class="chips" style="margin-top:2px;">${ep.l7Rules.map(r =>
              `<span class="right-pill"><span class="access-dot ${r.action === 'deny' ? 'deny' : 'rw'}" style="width:6px;height:6px;box-shadow:none;"></span>${escapeHtml(r.action.toUpperCase())} ${escapeHtml(r.method)} ${escapeHtml(r.path)}</span>`
            ).join('')}</div>`
          : '';
        const cliChipsHtml = (ep.compatibleCliCommands || []).length > 0
          ? `<div class="chips">${ep.compatibleCliCommands.map(cmd =>
              `<button class="copy-btn sample-cmd" data-cmd="${escapeHtml(cmd.replace(/<[^>]+>/g, 'test'))}">${escapeHtml(cmd)}</button>`
            ).join('')}</div>`
          : '';

        return `
          <details class="egress-fold" data-egress="${escapeHtml(epKey)}" ${isOpen ? 'open' : ''}>
            <summary>
              <div style="display:flex;align-items:center;gap:8px;min-width:0;flex:1;">
                <span class="fold-chevron">&#9654;</span>
                <span class="access-dot ${dotClass}" title="Right: ${escapeHtml(ep.access)}"></span>
                <span class="cmd-code" style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(ep.host)}${ep.port && ep.port !== 443 ? ':' + escapeHtml(ep.port) : ''}</span>
              </div>
              <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
                <span class="source-pill">&#8984; ${escapeHtml(triggerLabel)}</span>
              </div>
            </summary>
            <div class="egress-fold-body">
              <div style="color:var(--fg);line-height:1.45;">
                ${escapeHtml(explanationText)}
              </div>
              ${l7Html}
              <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;margin-top:2px;">
                ${cliChipsHtml}
                <span class="sub mono">${escapeHtml(ep.sourcePath || ep.source)}</span>
              </div>
            </div>
          </details>
        `;
      }).join('');

      return `
        ${l7ComposerFoldHtml}
        <div class="controls">
          <input id="egressSearch" type="text" placeholder="Filter host, CLI command, or script (e.g. github, npm, claude)..." value="${escapeHtml(egressSearch)}" />
          <button id="expandEgressBtn" class="copy-btn">Expand</button>
          <button id="collapseEgressBtn" class="copy-btn">Collapse</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          ${endpointsHtml || '<div class="sub">No matching egress policies found.</div>'}
        </div>
      `;
    }

    function describeMountPath(mountPath, access, wsName, agentName) {
      if (mountPath === `/sandbox/${wsName}`) {
        return {
          source: 'workspace',
          explanation: `Project worktree mounted read-write inside the sandbox.`,
          sourceFile: `${agentName}.json`,
        };
      }
      if (mountPath.startsWith('/sandbox/.')) {
        return {
          source: `${agentName}-state`,
          explanation: `Agent state & configuration directory mounted read-write across turns.`,
          sourceFile: `${agentName}.json`,
        };
      }
      if (mountPath === '/tmp' || mountPath.startsWith('/tmp/')) {
        return {
          source: 'temp-fs',
          explanation: `Ephemeral scratch directory inside the sandbox.`,
          sourceFile: `${agentName}.json`,
        };
      }
      return {
        source: access === 'read-write' ? 'fs-rw' : 'system-ro',
        explanation: access === 'read-write'
          ? `Writable Landlock filesystem path.`
          : `Read-only system path required to execute standard CLI tools and runtimes.`,
        sourceFile: `${agentName}.json`,
      };
    }

    function renderSystemTab() {
      const agents = currentReport.agents;
      const a = agents[0];
      if (!a) {
        return `<div class="card"><div class="sub">No agent profile found.</div></div>`;
      }
      const wsName = currentReport.selectedWorkspace.name;

      const fsEntries = [
        ...a.filesystemReadWrite.map(p => ({ path: p, access: 'read-write', dot: 'rw' })),
        ...a.filesystemReadOnly.map(p => ({ path: p, access: 'read-only', dot: 'ro' })),
      ];

      const fsCardsHtml = fsEntries.map(item => {
        const key = `fs:${item.access}:${item.path}`;
        const isOpen = openSystemItems.has(key);
        const info = describeMountPath(item.path, item.access, wsName, a.agent);
        return `
          <details class="egress-fold" data-sys-item="${escapeHtml(key)}" ${isOpen ? 'open' : ''}>
            <summary>
              <div style="display:flex;align-items:center;gap:8px;min-width:0;flex:1;">
                <span class="fold-chevron">&#9654;</span>
                <span class="access-dot ${item.dot}" title="Landlock: ${escapeHtml(item.access)}"></span>
                <span class="cmd-code" style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(item.path)}</span>
              </div>
              <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
                <span class="source-pill">&#8984; ${escapeHtml(info.source)}</span>
              </div>
            </summary>
            <div class="egress-fold-body">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;">
                <span style="color:var(--fg);">${escapeHtml(info.explanation)}</span>
                <span class="sub mono">${escapeHtml(info.sourceFile)}</span>
              </div>
            </div>
          </details>
        `;
      }).join('');

      const envCardsHtml = a.credentialPlaceholders.map(envKey => {
        const key = `env:${envKey}`;
        const isOpen = openSystemItems.has(key);
        return `
          <details class="egress-fold" data-sys-item="${escapeHtml(key)}" ${isOpen ? 'open' : ''}>
            <summary>
              <div style="display:flex;align-items:center;gap:8px;min-width:0;flex:1;">
                <span class="fold-chevron">&#9654;</span>
                <span class="access-dot l7" title="Supervisor-resolved credential placeholder"></span>
                <span class="cmd-code" style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(envKey)}</span>
              </div>
              <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
                <span class="source-pill">&#8984; openshell:resolve</span>
              </div>
            </summary>
            <div class="egress-fold-body">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;">
                <span style="color:var(--fg);">Proxy-injected credential placeholder (never readable in plain text inside the sandbox).</span>
                <span class="sub mono">${escapeHtml(a.providerProfile)}.profile.yaml</span>
              </div>
            </div>
          </details>
        `;
      }).join('');

      const binCardsHtml = a.allowedBinaries.map(binPath => {
        const key = `bin:${binPath}`;
        const isOpen = openSystemItems.has(key);
        const baseName = binPath.split('/').pop() || binPath;
        return `
          <details class="egress-fold" data-sys-item="${escapeHtml(key)}" ${isOpen ? 'open' : ''}>
            <summary>
              <div style="display:flex;align-items:center;gap:8px;min-width:0;flex:1;">
                <span class="fold-chevron">&#9654;</span>
                <span class="access-dot ro" title="Executable container binary"></span>
                <span class="cmd-code" style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(binPath)}</span>
              </div>
              <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
                <span class="source-pill">&#8984; ${escapeHtml(baseName)}</span>
              </div>
            </summary>
            <div class="egress-fold-body">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;">
                <span style="color:var(--fg);">Permitted runtime binary inside <code class="mono">${escapeHtml(a.containerImage)}</code>.</span>
                <span class="sub mono">${escapeHtml(a.hostWrapper)}</span>
              </div>
            </div>
          </details>
        `;
      }).join('');

      return `
        <details class="app-fold" data-section="sys-fs" ${openSections.has('sys-fs') || !openSections.has('sys-fs-closed') ? 'open' : ''}>
          <summary>
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="fold-chevron">&#9654;</span>
              <span class="access-dot rw"></span>
              <span>Filesystem (${fsEntries.length})</span>
            </div>
            <span class="source-pill">&#8984; landlock</span>
          </summary>
          <div class="app-fold-body">
            ${fsCardsHtml}
          </div>
        </details>

        <details class="app-fold" data-section="sys-vars" ${openSections.has('sys-vars') || !openSections.has('sys-vars-closed') ? 'open' : ''}>
          <summary>
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="fold-chevron">&#9654;</span>
              <span class="access-dot l7"></span>
              <span>Variables &amp; Binaries (${a.credentialPlaceholders.length + a.allowedBinaries.length})</span>
            </div>
            <span class="source-pill">&#8984; ${escapeHtml(a.providerProfile)}</span>
          </summary>
          <div class="app-fold-body">
            ${envCardsHtml}
            ${binCardsHtml}
          </div>
        </details>
      `;
    }

    function renderActiveTab() {
      if (!currentReport) return;
      const container = document.getElementById('tabContent');
      if (activeTab === 'cli') container.innerHTML = renderCliTab();
      else if (activeTab === 'egress') container.innerHTML = renderEgressTab();
      else container.innerHTML = renderSystemTab();

      container.querySelectorAll('details.app-fold').forEach(el => {
        el.addEventListener('toggle', () => {
          const app = el.dataset.app;
          if (app) {
            if (el.open) openApps.add(app);
            else openApps.delete(app);
          }
          const sec = el.dataset.section;
          if (sec) {
            if (el.open) openSections.add(sec);
            else openSections.delete(sec);
          }
        });
      });

      container.querySelectorAll('details.egress-fold').forEach(el => {
        el.addEventListener('toggle', () => {
          const key = el.dataset.egress;
          if (key) {
            if (el.open) openEgress.add(key);
            else openEgress.delete(key);
          }
          const cliRule = el.dataset.cliRule;
          if (cliRule) {
            if (el.open) openCliRules.add(cliRule);
            else openCliRules.delete(cliRule);
          }
          const sysItem = el.dataset.sysItem;
          if (sysItem) {
            if (el.open) openSystemItems.add(sysItem);
            else openSystemItems.delete(sysItem);
          }
        });
      });

      const expandEgressBtn = document.getElementById('expandEgressBtn');
      if (expandEgressBtn) {
        expandEgressBtn.addEventListener('click', () => {
          container.querySelectorAll('details.egress-fold').forEach(el => {
            el.open = true;
            if (el.dataset.egress) openEgress.add(el.dataset.egress);
          });
        });
      }
      const collapseEgressBtn = document.getElementById('collapseEgressBtn');
      if (collapseEgressBtn) {
        collapseEgressBtn.addEventListener('click', () => {
          openEgress.clear();
          container.querySelectorAll('details.egress-fold').forEach(el => {
            el.open = false;
          });
        });
      }

      const egressSearchInput = document.getElementById('egressSearch');
      if (egressSearchInput) {
        egressSearchInput.addEventListener('input', (e) => {
          egressSearch = e.target.value;
          renderActiveTab();
          const input = document.getElementById('egressSearch');
          if (input) {
            input.focus();
            input.setSelectionRange(input.value.length, input.value.length);
          }
        });
      }

      const expandAllBtn = document.getElementById('expandAllBtn');
      if (expandAllBtn) {
        expandAllBtn.addEventListener('click', () => {
          container.querySelectorAll('details.app-fold').forEach(el => {
            el.open = true;
            if (el.dataset.app) openApps.add(el.dataset.app);
          });
        });
      }
      const collapseAllBtn = document.getElementById('collapseAllBtn');
      if (collapseAllBtn) {
        collapseAllBtn.addEventListener('click', () => {
          openApps.clear();
          container.querySelectorAll('details.app-fold').forEach(el => {
            el.open = false;
          });
        });
      }

      const addL7Btn = document.getElementById('addL7Btn');
      if (addL7Btn) {
        addL7Btn.addEventListener('click', () => {
          const scope = document.getElementById('l7Scope').value;
          const action = document.getElementById('l7Action').value;
          const method = document.getElementById('l7Method').value;
          const host = document.getElementById('l7Host').value.trim();
          const port = Number(document.getElementById('l7Port').value) || 443;
          const path = document.getElementById('l7Path').value.trim() || '/**';
          const binary = document.getElementById('l7Binary').value.trim() || '*';
          const triggerCommand = document.getElementById('l7TriggerCmd')?.value?.trim() || '';
          openSections.add('l7-composer');
          applyL7PolicyRule({ scope, action, method, host, port, path, binary, triggerCommand }, 'l7ComposerStatus');
        });
      }

      const ruleSearch = document.getElementById('ruleSearch');
      if (ruleSearch) {
        ruleSearch.addEventListener('input', (e) => {
          searchFilter = e.target.value;
          renderActiveTab();
          const input = document.getElementById('ruleSearch');
          if (input) {
            input.focus();
            input.setSelectionRange(input.value.length, input.value.length);
          }
        });
      }
      const actionSelect = document.getElementById('actionSelect');
      if (actionSelect) {
        actionSelect.addEventListener('change', (e) => {
          actionFilter = e.target.value;
          renderActiveTab();
        });
      }
    }

    document.addEventListener('click', (e) => {
      const target = e.target;
      if (!(target instanceof HTMLElement)) return;

      if (target.dataset.copy) {
        copyText(target.dataset.copy, target);
      } else if (target.classList.contains('quick-l7-btn') && lastL7Suggestion) {
        const scope = target.dataset.l7Scope || 'workspace';
        applyL7PolicyRule({ ...lastL7Suggestion, scope }, 'quickL7Status');
      } else if (target.classList.contains('sample-cmd')) {
        const cmd = target.dataset.cmd || '';
        document.getElementById('cmdInput').value = cmd;
        runCommandCheck(cmd);
      } else if (target.classList.contains('tab')) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        target.classList.add('active');
        activeTab = target.dataset.tab || 'cli';
        renderActiveTab();
      }
    });

    document.getElementById('refreshBtn').addEventListener('click', () => {
      loadReport();
    });
    document.getElementById('testBtn').addEventListener('click', () => {
      runCommandCheck(document.getElementById('cmdInput').value);
    });
    document.getElementById('cmdInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') runCommandCheck(e.target.value);
    });

    window.addEventListener('focus', () => {
      loadReport();
    });
    setInterval(() => {
      if (!document.hidden) loadReport();
    }, 5000);

    loadReport();
  </script>
</body>
</html>
