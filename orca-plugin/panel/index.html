<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenShell Policies &amp; CLI Commands</title>
<style>
  :root {
    --bg: var(--orca-background, #0d1117);
    --fg: var(--orca-foreground, #e6edf3);
    --muted: var(--orca-muted, #161b22);
    --muted-fg: var(--orca-muted-foreground, #8b949e);
    --border: var(--orca-border, #30363d);
    --input: var(--orca-input, #21262d);
    --primary: var(--orca-primary, #2f81f7);
    --primary-fg: var(--orca-primary-foreground, #ffffff);
    --success: #2ea043;
    --success-bg: rgba(46, 160, 67, 0.14);
    --warn: #d29922;
    --warn-bg: rgba(210, 153, 34, 0.15);
    --danger: var(--orca-destructive, #f85149);
    --danger-bg: rgba(248, 81, 73, 0.14);
    --radius: var(--orca-radius, 8px);
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font: 12.5px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .container {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 10px;
    max-width: 100%;
  }
  .header {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px;
    background: var(--muted);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }
  .title {
    font-weight: 600;
    font-size: 13.5px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .controls {
    display: flex;
    gap: 6px;
    width: 100%;
  }
  select, input[type="text"] {
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    font: inherit;
    outline: none;
  }
  select { flex: 1; min-width: 0; }
  input[type="text"] { width: 100%; }
  select:focus, input[type="text"]:focus {
    border-color: var(--primary);
  }
  button {
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 9px;
    font: inherit;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover {
    background: var(--input);
  }
  button.primary {
    background: var(--primary);
    color: var(--primary-fg);
    border-color: var(--primary);
    font-weight: 500;
  }
  .tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
    overflow-x: auto;
  }
  .tab {
    padding: 5px 9px;
    border-radius: 6px;
    font-size: 12px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted-fg);
  }
  .tab.active {
    background: var(--muted);
    color: var(--fg);
    border-color: var(--border);
    font-weight: 600;
  }
  .card {
    background: var(--muted);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .card-title {
    font-weight: 600;
    font-size: 12.5px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .sub {
    color: var(--muted-fg);
    font-size: 11.5px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 6px;
    border-radius: 999px;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.01em;
    border: 1px solid transparent;
  }
  .badge.allow, .badge.pass {
    color: var(--success);
    background: var(--success-bg);
    border-color: rgba(46, 160, 67, 0.35);
  }
  .badge.ask, .badge.warn {
    color: var(--warn);
    background: var(--warn-bg);
    border-color: rgba(210, 153, 34, 0.35);
  }
  .badge.deny, .badge.block {
    color: var(--danger);
    background: var(--danger-bg);
    border-color: rgba(248, 81, 73, 0.35);
  }
  .badge.neutral {
    color: var(--muted-fg);
    background: var(--bg);
    border-color: var(--border);
  }
  .mono {
    font-family: var(--mono);
    font-size: 11.5px;
  }
  .cmd-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .cmd-left {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
    flex: 1;
  }
  .cmd-code {
    font-family: var(--mono);
    font-size: 11.5px;
    word-break: break-all;
    color: var(--fg);
  }
  .cmd-meta {
    font-size: 11px;
    color: var(--muted-fg);
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .chip {
    font-family: var(--mono);
    font-size: 11px;
    padding: 2px 6px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
  }
  .tester-box {
    display: flex;
    gap: 6px;
  }
  .eval-result {
    padding: 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .grid-2 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 6px;
  }
  .stat-box {
    padding: 7px 9px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .copy-btn {
    padding: 2px 6px;
    font-size: 10.5px;
  }
  details.app-fold {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  details.app-fold > summary {
    list-style: none;
    cursor: pointer;
    padding: 8px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    user-select: none;
    font-weight: 600;
    font-size: 12px;
  }
  details.app-fold > summary::-webkit-details-marker {
    display: none;
  }
  details.app-fold > summary:hover {
    background: rgba(255, 255, 255, 0.03);
  }
  .fold-chevron {
    display: inline-block;
    font-size: 10px;
    color: var(--muted-fg);
    transition: transform 0.15s ease;
    width: 12px;
  }
  details.app-fold[open] > summary .fold-chevron {
    transform: rotate(90deg);
  }
  .app-fold-body {
    padding: 8px 10px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: var(--bg);
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-top">
        <div class="title">
          <span>OpenShell Policy &amp; CLI Inspector</span>
          <span id="sandboxBadge" class="badge neutral">Loading...</span>
        </div>
        <button id="refreshBtn" title="Reload active project &amp; agent policies">Refresh</button>
      </div>
      <div id="contextBanner" class="grid-2" style="margin-top:2px;">
        <div class="stat-box">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span class="sub">Current Project</span>
            <span id="branchBadge" class="badge neutral">—</span>
          </div>
          <strong id="projectLabel" class="mono" style="font-size:12px;">Detecting...</strong>
          <span id="projectPathLabel" class="sub mono" style="font-size:10px;word-break:break-all;"></span>
        </div>
        <div class="stat-box">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span class="sub">Running Agent</span>
            <span id="agentStateBadge" class="badge allow">Active</span>
          </div>
          <strong id="agentLabel" class="mono" style="font-size:12px;">Detecting...</strong>
          <span id="agentSessionLabel" class="sub" style="font-size:10px;"></span>
        </div>
      </div>
    </div>

    <!-- Interactive CLI Command Policy Tester -->
    <div class="card">
      <div class="card-title">
        <span>Test CLI Command Policy Compatibility</span>
        <span class="sub">DENY &gt; ASK &gt; ALLOW + Landlock + Network</span>
      </div>
      <div class="tester-box">
        <input id="cmdInput" type="text" class="mono" placeholder="e.g. git status, docker ps, sudo rm -rf /, orca orchestration worker-start..." />
        <button id="testBtn" class="primary">Check</button>
      </div>
      <div class="chips" id="sampleCmds">
        <button class="copy-btn sample-cmd" data-cmd="git status -s">git status -s</button>
        <button class="copy-btn sample-cmd" data-cmd="curl -X GET https://api.github.com/repos/klcd/nixos-config">curl api.github.com (L7)</button>
        <button class="copy-btn sample-cmd" data-cmd="gh pr view 115">gh pr view (L7)</button>
        <button class="copy-btn sample-cmd" id="sampleWorkerCmd" data-cmd="orca orchestration worker-start --agent claude --spec 'Run tests' --worktree current --json">orca worker-start</button>
        <button class="copy-btn sample-cmd" data-cmd="sudo rm -rf /">sudo rm -rf /</button>
      </div>
      <div id="evalOutput" style="display:none;" class="eval-result"></div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="cli">CLI Commands (<span id="cliCount">0</span>)</button>
      <button class="tab" data-tab="sandbox">Agent Sandbox &amp; Egress</button>
      <button class="tab" data-tab="delegation">Orchestration CLI</button>
    </div>

    <div id="tabContent"></div>
  </div>

  <script>
    let currentReport = null;
    let activeTab = 'cli';
    let searchFilter = '';
    let actionFilter = 'all';
    const openApps = new Set();

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function copyText(text, btn) {
      try {
        await navigator.clipboard.writeText(text);
        if (btn) {
          const prev = btn.textContent;
          btn.textContent = 'Copied';
          setTimeout(() => { btn.textContent = prev; }, 1000);
        }
      } catch {}
    }

    async function loadReport() {
      try {
        const res = await window.orca.plugin.request('getPolicyReport', {});
        const changedContext =
          !currentReport ||
          currentReport.selectedWorkspace.path !== res.selectedWorkspace.path ||
          currentReport.currentAgent !== res.currentAgent ||
          currentReport.activeSandboxes.length !== res.activeSandboxes.length;
        currentReport = res;
        renderHeader();
        if (changedContext || !document.getElementById('ruleSearch')) {
          renderActiveTab();
        }
        const cmd = document.getElementById('cmdInput').value.trim();
        if (cmd && changedContext) await runCommandCheck(cmd);
      } catch (err) {
        document.getElementById('tabContent').innerHTML =
          `<div class="card"><span class="badge deny">Error</span><div class="mono">${escapeHtml(err?.message || err)}</div></div>`;
      }
    }

    function renderHeader() {
      if (!currentReport) return;
      const sbCount = currentReport.activeSandboxes.length;
      const badge = document.getElementById('sandboxBadge');
      badge.className = 'badge ' + (sbCount > 0 ? 'allow' : 'neutral');
      badge.textContent = sbCount > 0
        ? `${sbCount} Active Sandbox${sbCount === 1 ? '' : 'es'}`
        : 'Landlock Enforced';

      const ws = currentReport.selectedWorkspace;
      document.getElementById('projectLabel').textContent = ws.name;
      document.getElementById('projectPathLabel').textContent = ws.path;
      const branchBadge = document.getElementById('branchBadge');
      branchBadge.textContent = ws.branch || 'main';

      const agentObj = currentReport.agents[0];
      const activeSession = (currentReport.activeAgentSessions || [])[0];
      const agentDisplay = agentObj ? `${agentObj.displayName} (${agentObj.agent})` : currentReport.currentAgent;
      document.getElementById('agentLabel').textContent = agentDisplay;

      const stateBadge = document.getElementById('agentStateBadge');
      const sessionState = activeSession ? activeSession.state : (sbCount > 0 ? 'sandboxed' : 'ready');
      stateBadge.textContent = sessionState.toUpperCase();
      stateBadge.className = 'badge ' + (sessionState === 'working' || sessionState === 'running' || sbCount > 0 ? 'allow' : 'neutral');

      const sessionLabel = document.getElementById('agentSessionLabel');
      sessionLabel.textContent = activeSession?.conversationName
        ? activeSession.conversationName
        : (agentObj ? `Wrapper: ${agentObj.agent === 'antigravity' ? 'agy-box' : agentObj.agent + '-box'}` : '');

      const workerBtn = document.getElementById('sampleWorkerCmd');
      if (workerBtn) {
        workerBtn.dataset.cmd = `orca orchestration worker-start --agent ${currentReport.currentAgent} --spec 'Run tests' --worktree current --json`;
      }

      const agentRules = currentReport.allCliRules.filter(r => r.compatibleAgents.includes(currentReport.currentAgent));
      document.getElementById('cliCount').textContent = String(agentRules.length);
    }

    let lastL7Suggestion = null;

    async function applyL7PolicyRule(payload, statusElId) {
      const statusEl = document.getElementById(statusElId);
      if (statusEl) {
        statusEl.style.display = 'flex';
        statusEl.innerHTML = `<span class="badge neutral">Applying L7 policy...</span>`;
      }
      try {
        const res = await window.orca.plugin.request('addL7Policy', {
          ...payload,
          workspacePath: currentReport?.selectedWorkspace?.path,
          agent: currentReport?.currentAgent,
        });
        if (statusEl) {
          const cmdsHtml = (res.cliCommandsRun || []).map(c => `<div class="mono sub">$ ${escapeHtml(c)}</div>`).join('');
          statusEl.innerHTML = `
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
              <span class="badge ${res.ok ? 'allow' : 'deny'}">${res.ok ? 'APPLIED' : 'ERROR'}</span>
              <span>${escapeHtml(res.message)}</span>
            </div>
            ${cmdsHtml}
          `;
        }
        if (res.ok) {
          const reportRes = await window.orca.plugin.request('getPolicyReport', {});
          currentReport = reportRes;
          renderHeader();
          renderActiveTab();
          const cmd = document.getElementById('cmdInput').value.trim();
          if (cmd) await runCommandCheck(cmd);
        }
      } catch (err) {
        if (statusEl) {
          statusEl.innerHTML = `<span class="badge deny">Error</span><div>${escapeHtml(err?.message || err)}</div>`;
        }
      }
    }

    async function runCommandCheck(command) {
      if (!command || !currentReport) return;
      const box = document.getElementById('evalOutput');
      try {
        const res = await window.orca.plugin.request('evaluateCommand', {
          command,
          workspacePath: currentReport.selectedWorkspace.path,
          agent: currentReport.currentAgent,
        });
        lastL7Suggestion = res.l7Suggestion || null;
        box.style.display = 'flex';
        const badgeLabel = res.verdict.toUpperCase();
        const rulesHtml = (res.matchedRules || []).map(r =>
          `<div class="cmd-meta"><span class="badge ${escapeHtml(r.action)}">${escapeHtml(r.action.toUpperCase())}</span> <span class="mono">${escapeHtml(r.cliCommand)}</span> <span>(${escapeHtml(r.scope)}: ${escapeHtml(r.sourceFile)})</span></div>`
        ).join('');
        const checksHtml = (res.sandboxChecks || []).map(c =>
          `<div class="cmd-meta"><span class="badge ${escapeHtml(c.status)}">${escapeHtml(c.status.toUpperCase())}</span> <strong>${escapeHtml(c.layer)}:</strong> <span>${escapeHtml(c.detail)}</span></div>`
        ).join('');
        const l7ActionHtml = res.l7Suggestion
          ? `<div style="margin-top:4px;padding-top:6px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px;">
              <div class="cmd-meta">
                <strong>L7 HTTP Rule:</strong>
                <code class="mono">${escapeHtml(res.l7Suggestion.action.toUpperCase())} ${escapeHtml(res.l7Suggestion.method)} https://${escapeHtml(res.l7Suggestion.host)}:${res.l7Suggestion.port}${escapeHtml(res.l7Suggestion.path)}</code>
                <span>(binary: <code class="mono">${escapeHtml(res.l7Suggestion.binary)}</code>)</span>
              </div>
              <div style="display:flex;gap:6px;flex-wrap:wrap;">
                <button class="copy-btn quick-l7-btn" data-l7-scope="session" title="Hot-reload on running sandbox via openshell policy update">+ Add L7 for Session (Live Sandbox)</button>
                <button class="copy-btn quick-l7-btn" data-l7-scope="workspace" title="Save to <project>/.agents/policies/l7-custom.json &amp; apply live">+ Add L7 for Project</button>
                <button class="copy-btn quick-l7-btn" data-l7-scope="global" title="Save to ~/.agents/orca-openshell-policies/<agent>.json &amp; apply live">+ Add L7 in General (${escapeHtml(currentReport.currentAgent)})</button>
              </div>
              <div id="quickL7Status" style="display:none;" class="eval-result"></div>
            </div>`
          : '';
        box.innerHTML = `
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <span class="badge ${escapeHtml(res.verdict)}">${escapeHtml(badgeLabel)}</span>
            <span class="mono" style="font-weight:600;">${escapeHtml(res.command)}</span>
          </div>
          <div class="sub">${escapeHtml(res.summary)}</div>
          ${rulesHtml}
          ${checksHtml}
          ${l7ActionHtml}
        `;
      } catch (err) {
        box.style.display = 'flex';
        box.innerHTML = `<span class="badge deny">Error</span><div>${escapeHtml(err?.message || err)}</div>`;
      }
    }

    function renderNativeSyncCard() {
      const ns = currentReport.nativeSync;
      const agent = currentReport.currentAgent;
      if (agent === 'claude') {
        return `
          <div class="stat-box">
            <div style="display:flex;justify-content:space-between;">
              <strong>Claude Native Config (<code class="mono">.claude/settings.json</code>)</strong>
              <span class="badge ${ns.claudeSynced ? 'allow' : 'neutral'}">${ns.claudeSynced ? 'Synced' : 'Default'}</span>
            </div>
            <span class="sub">${ns.claudeAllowCount} allow / ${ns.claudeDenyCount} deny rules in ${escapeHtml(currentReport.selectedWorkspace.name)}</span>
          </div>
        `;
      }
      if (agent === 'codex') {
        return `
          <div class="stat-box">
            <div style="display:flex;justify-content:space-between;">
              <strong>Codex Native Config (<code class="mono">.codex/rules/default.rules</code>)</strong>
              <span class="badge ${ns.codexSynced ? 'allow' : 'neutral'}">${ns.codexSynced ? 'Synced' : 'Default'}</span>
            </div>
            <span class="sub">${ns.codexRuleCount} execpolicy prefix_rules in ${escapeHtml(currentReport.selectedWorkspace.name)}</span>
          </div>
        `;
      }
      return `
        <div class="stat-box">
          <div style="display:flex;justify-content:space-between;">
            <strong>Antigravity Native Config (<code class="mono">.gemini/settings.json</code>)</strong>
            <span class="badge ${ns.geminiSynced ? 'allow' : 'neutral'}">${ns.geminiSynced ? 'Synced' : 'Default'}</span>
          </div>
          <span class="sub">${ns.geminiAllowCount} allow / ${ns.geminiDenyCount} exclude rules in ${escapeHtml(currentReport.selectedWorkspace.name)}</span>
        </div>
      `;
    }

    function renderCliTab() {
      const selectedAgent = currentReport.currentAgent;

      const filteredRules = currentReport.allCliRules.filter(r => {
        if (!r.compatibleAgents.includes(selectedAgent)) return false;
        if (actionFilter !== 'all' && r.action !== actionFilter) return false;
        if (!searchFilter) return true;
        const q = searchFilter.toLowerCase();
        return r.cliCommand.toLowerCase().includes(q) ||
               r.baseBinary.toLowerCase().includes(q) ||
               r.raw.toLowerCase().includes(q) ||
               r.groupName.toLowerCase().includes(q);
      });

      // Group rules by CLI application (baseBinary)
      const byApp = new Map();
      for (const r of filteredRules) {
        const appKey = r.baseBinary || r.tool || 'other';
        if (!byApp.has(appKey)) byApp.set(appKey, []);
        byApp.get(appKey).push(r);
      }

      const sortedApps = [...byApp.entries()].sort((a, b) => a[0].localeCompare(b[0]));

      const appsHtml = sortedApps.map(([appName, rules]) => {
        const allowCount = rules.filter(r => r.action === 'allow').length;
        const askCount = rules.filter(r => r.action === 'ask').length;
        const denyCount = rules.filter(r => r.action === 'deny').length;
        const sources = [...new Set(rules.map(r => `${r.scope}:${r.groupName}`))].join(', ');
        const isOpen = Boolean(searchFilter) || openApps.has(appName);

        const rows = rules.map(r => `
          <div class="cmd-row">
            <div class="cmd-left">
              <div class="cmd-code">${escapeHtml(r.cliCommand)}</div>
              <div class="cmd-meta">
                <span>Rule: <code class="mono">${escapeHtml(r.raw)}</code></span>
                <span>• Source: <code class="mono">${escapeHtml(r.scope)}/${escapeHtml(r.sourceFile)}</code></span>
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:6px;">
              <span class="badge ${escapeHtml(r.action)}">${escapeHtml(r.action.toUpperCase())}</span>
              <button class="copy-btn" data-copy="${escapeHtml(r.cliCommand.replace(/\s*\[args\.\.\.\]/, ''))}">Copy</button>
            </div>
          </div>
        `).join('');

        return `
          <details class="app-fold" data-app="${escapeHtml(appName)}" ${isOpen ? 'open' : ''}>
            <summary>
              <div style="display:flex;align-items:center;gap:6px;min-width:0;">
                <span class="fold-chevron">▶</span>
                <code class="mono" style="font-size:12px;font-weight:700;">${escapeHtml(appName)}</code>
                <span class="sub" style="font-weight:400;">(${rules.length} rule${rules.length === 1 ? '' : 's'} • ${escapeHtml(sources)})</span>
              </div>
              <div style="display:flex;gap:4px;flex-shrink:0;">
                ${allowCount ? `<span class="badge allow">${allowCount} allow</span>` : ''}
                ${askCount ? `<span class="badge ask">${askCount} ask</span>` : ''}
                ${denyCount ? `<span class="badge deny">${denyCount} deny</span>` : ''}
              </div>
            </summary>
            <div class="app-fold-body">
              ${rows}
            </div>
          </details>
        `;
      }).join('');

      return `
        <div class="card">
          ${renderNativeSyncCard()}
          <div class="controls" style="margin-top:4px;">
            <input id="ruleSearch" type="text" placeholder="Filter CLI application or command (e.g. git, docker, kubectl, sudo)..." value="${escapeHtml(searchFilter)}" />
            <select id="actionSelect" style="max-width:120px;">
              <option value="all" ${actionFilter === 'all' ? 'selected' : ''}>All Actions</option>
              <option value="allow" ${actionFilter === 'allow' ? 'selected' : ''}>Allowed Only</option>
              <option value="deny" ${actionFilter === 'deny' ? 'selected' : ''}>Blocked Only</option>
            </select>
            <button id="expandAllBtn" class="copy-btn" title="Expand all CLI applications">Expand All</button>
            <button id="collapseAllBtn" class="copy-btn" title="Collapse all CLI applications">Collapse All</button>
          </div>
        </div>
        ${appsHtml || '<div class="card"><div class="sub">No matching CLI permission rules found.</div></div>'}
      `;
    }

    function renderSandboxTab() {
      const agents = currentReport.agents;

      const l7ComposerHtml = `
        <div class="card">
          <div class="card-title">
            <span>Add Dynamic L7 HTTP Egress Policy</span>
            <span class="sub">Session (Hot-Reload) or Persistent</span>
          </div>
          <div class="controls">
            <select id="l7Scope" style="max-width:190px;" title="Where to apply this L7 policy">
              <option value="workspace">Project (${escapeHtml(currentReport.selectedWorkspace.name)}/.agents/policies)</option>
              <option value="global">In General (~/.agents/orca-openshell-policies/${escapeHtml(currentReport.currentAgent)}.json)</option>
              <option value="session">Current Session Only (Live Sandbox)</option>
            </select>
            <select id="l7Action" style="max-width:95px;">
              <option value="allow">ALLOW</option>
              <option value="deny">DENY</option>
            </select>
            <select id="l7Method" style="max-width:95px;">
              <option value="GET">GET</option>
              <option value="POST">POST</option>
              <option value="PUT">PUT</option>
              <option value="PATCH">PATCH</option>
              <option value="DELETE">DELETE</option>
              <option value="*">* (ANY)</option>
            </select>
          </div>
          <div class="controls">
            <input id="l7Host" type="text" class="mono" placeholder="Host (e.g. api.github.com)" style="flex:2;" />
            <input id="l7Port" type="text" class="mono" value="443" placeholder="Port" style="max-width:65px;" />
            <input id="l7Path" type="text" class="mono" value="/repos/**" placeholder="Path glob (e.g. /repos/**)" style="flex:2;" />
          </div>
          <div class="controls">
            <input id="l7Binary" type="text" class="mono" value="*" placeholder="Binary path (e.g. /usr/bin/gh or * for any)" style="flex:1;" />
            <button id="addL7Btn" class="primary">Add L7 Policy</button>
          </div>
          <div id="l7ComposerStatus" style="display:none;" class="eval-result"></div>
        </div>
      `;

      const activeHtml = currentReport.activeSandboxes.length > 0
        ? `<div class="card">
            <div class="card-title"><span>Running OpenShell Sandboxes (${escapeHtml(currentReport.currentAgent)})</span><span class="badge allow">${currentReport.activeSandboxes.length} Ready</span></div>
            ${currentReport.activeSandboxes.map(sb => `
              <div class="cmd-row">
                <div class="cmd-left">
                  <div class="cmd-code">${escapeHtml(sb.name)}</div>
                  <div class="cmd-meta">Agent: ${escapeHtml(sb.agent)} • Created: ${escapeHtml(sb.created)}</div>
                </div>
                <span class="badge allow">${escapeHtml(sb.phase)}</span>
              </div>
            `).join('')}
          </div>`
        : '';

      const agentsHtml = agents.map(a => `
        <div class="card">
          <div class="card-title">
            <span>${escapeHtml(a.displayName)} <code class="mono">(${escapeHtml(a.agent)})</code></span>
            <div style="display:flex;gap:4px;">
              <span class="badge ${a.hostWrapperInstalled ? 'allow' : 'deny'}">${a.hostWrapperInstalled ? 'Wrapper Installed' : 'Missing Wrapper'}</span>
              <span class="badge allow">Landlock: ${escapeHtml(a.landlockMode)}</span>
            </div>
          </div>
          <div class="sub">Image: <code class="mono">${escapeHtml(a.containerImage)}</code> • Profile: <code class="mono">${escapeHtml(a.providerProfile)}</code></div>

          <div class="sub" style="font-weight:600;color:var(--fg);margin-top:4px;">Compatible Launch CLI Commands</div>
          ${a.surfaces.map(s => `
            <div class="cmd-row">
              <div class="cmd-left">
                <div class="cmd-code">${escapeHtml(s.cliExample)}</div>
                <div class="cmd-meta">${escapeHtml(s.surface)} • ${escapeHtml(s.transport)}</div>
              </div>
              <button class="copy-btn" data-copy="${escapeHtml(s.cliExample)}">Copy</button>
            </div>
          `).join('')}

          <div class="sub" style="font-weight:600;color:var(--fg);margin-top:4px;">Allowed Container Binaries &amp; Credential Placeholders</div>
          <div class="chips">
            ${a.allowedBinaries.map(b => `<span class="chip">${escapeHtml(b)}</span>`).join('')}
            ${a.credentialPlaceholders.map(c => `<span class="chip" title="Supervisor placeholder env">${escapeHtml(c)}=openshell:resolve:...</span>`).join('')}
          </div>

          <div class="sub" style="font-weight:600;color:var(--fg);margin-top:4px;">Landlock Filesystem Policy (${escapeHtml(currentReport.selectedWorkspace.name)})</div>
          <div class="cmd-row">
            <div class="cmd-left">
              <div class="cmd-meta"><span class="badge allow">READ-WRITE</span> <span class="mono">${escapeHtml(a.filesystemReadWrite.join(', '))}</span></div>
              <div class="cmd-meta" style="margin-top:4px;"><span class="badge neutral">READ-ONLY</span> <span class="mono">${escapeHtml(a.filesystemReadOnly.join(', '))}</span></div>
            </div>
          </div>

          <div class="sub" style="font-weight:600;color:var(--fg);margin-top:4px;">Allowed Network &amp; L7 Egress Endpoints (Coupled to CLI Commands)</div>
          ${a.endpoints.map(ep => {
            const l7Html = (ep.l7Rules || []).length > 0
              ? `<div class="chips" style="margin-top:3px;">${ep.l7Rules.map(r =>
                  `<span class="badge ${r.action === 'deny' ? 'deny' : 'allow'}">${escapeHtml(r.action.toUpperCase())} ${escapeHtml(r.method)} ${escapeHtml(r.path)}</span>`
                ).join('')}</div>`
              : '';
            return `
            <div class="cmd-row">
              <div class="cmd-left">
                <div class="cmd-code">${escapeHtml(ep.host)}:${escapeHtml(ep.port)} <span class="sub">(${escapeHtml(ep.policyName)})</span></div>
                <div class="cmd-meta">
                  <span>Compatible CLI: <code class="mono">${escapeHtml(ep.compatibleCliCommands.join(', '))}</code></span>
                  <span>• Source: ${escapeHtml(ep.source)}</span>
                </div>
                ${l7Html}
              </div>
              <span class="badge ${ep.access === 'read-only' ? 'neutral' : 'allow'}">${escapeHtml(ep.access)}</span>
            </div>
            `;
          }).join('')}
        </div>
      `).join('');

      return l7ComposerHtml + activeHtml + agentsHtml;
    }

    function renderDelegationTab() {
      const d = currentReport.delegation;
      const grantsHtml = d.activeGrants.length > 0
        ? d.activeGrants.map(g => `
            <div class="cmd-row">
              <div class="cmd-left">
                <div class="cmd-code">${escapeHtml(g.terminal)}</div>
                <div class="cmd-meta">Agents: ${escapeHtml(g.agents.join(', '))} • Depth: ${g.depth}/${g.maxDepth} • Remaining workers: ${g.remainingWorkers}/${g.maxWorkers}</div>
              </div>
              <span class="badge allow">Active Grant</span>
            </div>
          `).join('')
        : `<div class="sub">No active terminal grants currently open for ${escapeHtml(currentReport.selectedWorkspace.name)}.</div>`;

      return `
        <div class="card">
          <div class="card-title">
            <span>In-Sandbox Worker Delegation Policy (${escapeHtml(currentReport.selectedWorkspace.name)})</span>
            <span class="badge ${d.autoGrantEnabled ? 'allow' : 'neutral'}">${d.autoGrantEnabled ? 'Auto-Grant Enabled' : 'Manual Grant'}</span>
          </div>
          <div class="sub">
            Allowed Worker Agents: <code class="mono">${escapeHtml(d.allowedAgents.join(', '))}</code> •
            Max Workers: <code class="mono">${d.maxWorkers}</code> •
            Max Depth: <code class="mono">${d.maxDepth}</code>
          </div>
          <div class="sub" style="font-weight:600;color:var(--fg);margin-top:4px;">Active Coordinator Terminal Grants</div>
          ${grantsHtml}
        </div>

        <div class="card">
          <div class="card-title">
            <span>Allowed In-Sandbox <code class="mono">orca orchestration</code> CLI Commands</span>
            <span class="badge allow">FIFO Broker</span>
          </div>
          ${d.allowedCliCommands.map(c => `
            <div class="cmd-row">
              <div class="cmd-left">
                <div class="cmd-code">${escapeHtml(c.command)}</div>
                <div class="cmd-meta">${escapeHtml(c.description)}</div>
              </div>
              <button class="copy-btn" data-copy="${escapeHtml(c.command)}">Copy</button>
            </div>
          `).join('')}
          <div class="sub" style="font-weight:600;color:var(--fg);margin-top:4px;">Refused / Blocked CLI Flags Inside Sandbox</div>
          <div class="chips">
            ${d.blockedFlags.map(f => `<span class="chip" style="border-color:var(--danger);color:var(--danger);">${escapeHtml(f)}</span>`).join('')}
          </div>
        </div>
      `;
    }

    function renderActiveTab() {
      if (!currentReport) return;
      const container = document.getElementById('tabContent');
      if (activeTab === 'cli') container.innerHTML = renderCliTab();
      else if (activeTab === 'sandbox') container.innerHTML = renderSandboxTab();
      else container.innerHTML = renderDelegationTab();

      container.querySelectorAll('details.app-fold').forEach(el => {
        el.addEventListener('toggle', () => {
          const app = el.dataset.app;
          if (!app) return;
          if (el.open) openApps.add(app);
          else openApps.delete(app);
        });
      });

      const expandAllBtn = document.getElementById('expandAllBtn');
      if (expandAllBtn) {
        expandAllBtn.addEventListener('click', () => {
          container.querySelectorAll('details.app-fold').forEach(el => {
            el.open = true;
            if (el.dataset.app) openApps.add(el.dataset.app);
          });
        });
      }
      const collapseAllBtn = document.getElementById('collapseAllBtn');
      if (collapseAllBtn) {
        collapseAllBtn.addEventListener('click', () => {
          openApps.clear();
          container.querySelectorAll('details.app-fold').forEach(el => {
            el.open = false;
          });
        });
      }

      const addL7Btn = document.getElementById('addL7Btn');
      if (addL7Btn) {
        addL7Btn.addEventListener('click', () => {
          const scope = document.getElementById('l7Scope').value;
          const action = document.getElementById('l7Action').value;
          const method = document.getElementById('l7Method').value;
          const host = document.getElementById('l7Host').value.trim();
          const port = Number(document.getElementById('l7Port').value) || 443;
          const path = document.getElementById('l7Path').value.trim() || '/**';
          const binary = document.getElementById('l7Binary').value.trim() || '*';
          applyL7PolicyRule({ scope, action, method, host, port, path, binary }, 'l7ComposerStatus');
        });
      }

      const ruleSearch = document.getElementById('ruleSearch');
      if (ruleSearch) {
        ruleSearch.addEventListener('input', (e) => {
          searchFilter = e.target.value;
          renderActiveTab();
          const input = document.getElementById('ruleSearch');
          if (input) {
            input.focus();
            input.setSelectionRange(input.value.length, input.value.length);
          }
        });
      }
      const actionSelect = document.getElementById('actionSelect');
      if (actionSelect) {
        actionSelect.addEventListener('change', (e) => {
          actionFilter = e.target.value;
          renderActiveTab();
        });
      }
    }

    document.addEventListener('click', (e) => {
      const target = e.target;
      if (!(target instanceof HTMLElement)) return;

      if (target.dataset.copy) {
        copyText(target.dataset.copy, target);
      } else if (target.classList.contains('quick-l7-btn') && lastL7Suggestion) {
        const scope = target.dataset.l7Scope || 'workspace';
        applyL7PolicyRule({ ...lastL7Suggestion, scope }, 'quickL7Status');
      } else if (target.classList.contains('sample-cmd')) {
        const cmd = target.dataset.cmd || '';
        document.getElementById('cmdInput').value = cmd;
        runCommandCheck(cmd);
      } else if (target.classList.contains('tab')) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        target.classList.add('active');
        activeTab = target.dataset.tab || 'cli';
        renderActiveTab();
      }
    });

    document.getElementById('refreshBtn').addEventListener('click', () => {
      loadReport();
    });
    document.getElementById('testBtn').addEventListener('click', () => {
      runCommandCheck(document.getElementById('cmdInput').value);
    });
    document.getElementById('cmdInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') runCommandCheck(e.target.value);
    });

    window.addEventListener('focus', () => {
      loadReport();
    });
    setInterval(() => {
      if (!document.hidden) loadReport();
    }, 5000);

    loadReport();
  </script>
</body>
</html>
